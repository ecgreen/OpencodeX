name: CLI subprocess diagnostic

# Temporary. Runs only the CLI subprocess suites on the Windows runner and
# reports real per-case durations, so a budget overshoot can be told apart from
# a wedged child. Delete once the Windows subprocess coverage is settled.

on:
  workflow_dispatch:
  # Push-triggered so it can run before it exists on the default branch, which
  # workflow_dispatch would otherwise require. Nothing else builds this prefix,
  # so a diagnostic push costs one short job instead of the full CI matrix.
  push:
    branches: ["diagnostic/**"]

permissions:
  contents: read
  checks: write

jobs:
  diagnose:
    name: cli subprocess (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Diagnose CLI subprocess suites
        working-directory: packages/opencode
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          # Deliberately far above any plausible real duration. A case that hits
          # this is wedged, not slow, and that distinction is the whole question.
          OPENCODE_TEST_CLI_TIMEOUT_MS: "240000"
          OPENCODE_TEST_CLI_BOOT_MS: "240000"
        run: bun run script/diagnose-cli-subprocess.ts
