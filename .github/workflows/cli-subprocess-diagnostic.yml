name: CLI subprocess diagnostic

# Temporary. Mirrors the CI unit job for Windows so the full run can be timed
# and read on a branch, because CI itself only builds main and pull requests
# and there is no PR to attach to yet. Delete once the Windows subprocess
# coverage is settled.

on:
  workflow_dispatch:
  # Push-triggered so it can run before it exists on the default branch, which
  # workflow_dispatch would otherwise require.
  push:
    branches: ["diagnostic/**"]

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: full unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run unit tests
        run: |
          set -o pipefail
          bun run test:ci 2>&1 | tee "${RUNNER_TEMP//\\//}/unit.log"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
      - name: Surface unit failures
        if: failure()
        run: bun run script/annotate-unit-failures.ts "${RUNNER_TEMP//\\//}/unit.log"
