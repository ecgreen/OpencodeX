name: CLI subprocess diagnostic

# Temporary. Mirrors the CI unit and cli-subprocess jobs for Windows so the
# split can be validated and timed on a branch, because CI itself only builds
# main and pull requests and there is no PR to attach to yet. Delete once this
# lands.

on:
  workflow_dispatch:
  push:
    branches: ["diagnostic/**"]

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: full unit (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run unit tests
        run: |
          set -o pipefail
          bun run test:ci 2>&1 | tee "${RUNNER_TEMP//\\//}/unit.log"
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
      - name: Surface unit failures
        if: failure()
        run: bun run script/annotate-unit-failures.ts "${RUNNER_TEMP//\\//}/unit.log"

  cli-subprocess:
    name: cli subprocess (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Run CLI subprocess suites
        working-directory: packages/opencode
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: bun run test:ci:cli
