name: "OpencodeX GitHub Action"
description: "Run OpencodeX in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the opencode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of an optional custom GitHub App token exchange."
    required: false
    default: "true"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/opencode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.opencode.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get OpencodeX version
      id: version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/ecgreen/OpencodeX/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache OpencodeX
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.opencodex/bin
        key: opencodex-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install OpencodeX
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        version="${{ steps.version.outputs.version }}"
        url="https://github.com/ecgreen/OpencodeX/releases/latest/download/install"
        args=(--no-modify-path)
        if [[ "$version" != "latest" ]]; then
          url="https://github.com/ecgreen/OpencodeX/releases/download/${version}/install"
          args=(--version "$version" --no-modify-path)
        fi
        curl -fsSL "$url" | OPENCODEX_GITHUB_REPO=ecgreen/OpencodeX bash -s -- "${args[@]}"

    - name: Add OpencodeX to PATH
      shell: bash
      run: echo "$HOME/.opencodex/bin" >> $GITHUB_PATH

    - name: Run OpencodeX
      shell: bash
      id: run_opencode
      run: opencodex github run
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
